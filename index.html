<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <meta name="description" content="Minimal video generation PWA">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <title>Video Generator</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#111;color:#eee;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
    .app{width:min(720px,100%);margin:0 auto;padding:28px 0 48px}
    header{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:24px}
    h1,h2{margin:0;font-size:18px;font-weight:600;letter-spacing:.08em}
    h2{font-size:14px}
    .status{color: #ccc; font-size:11px;letter-spacing:.08em;}

    .panel,.result{padding:0 0 18px;margin-bottom:18px}
    label{display:block;font-size:12px;opacity:.65;margin:12px 0 7px}
    select,textarea,input{width:100%;border:1px solid #444;border-radius:9px;background:#181818;color:#eee;font:inherit;padding:12px;outline:none}
    select:focus,textarea:focus{border-color:#777}
    textarea{min-height:150px;resize:vertical;margin-bottom:18px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
    button{width:100%;padding:13px;border:1;border-radius:9px;background:#000;color:#fff;font:600 14px inherit;cursor:pointer}
    button:active{transform:scale(.99)}
    button:disabled{opacity:.45;cursor:default}
    .message{min-height:18px;margin:12px 0 0;font-size:12px;opacity:.65}
    .result-box{min-height:260px;border:1px dashed #444;border-radius:10px;display:grid;place-items:center;text-align:center;padding:20px;color:#777}
    .result-box video{max-width:100%;border-radius:8px}
    @media(max-width:520px){
      .app{padding-top:20px}
      .grid{grid-template-columns:1fr}

.header-main {
  display: flex;
  align-items: center;
}

.header-text {
  display: flex;
  flex-direction: column;
}

#header-logo {
  width: 34px;
  margin-right: 10px;
}

    }
  </style>
</head>
<body>
  <main class="app">

<header>
  <div class="header-main">
    <a href="https://eqlectika.github.io/match.html">
      <img src="star.png" id="header-logo">
    </a>

    <div class="header-text">
      <h1>CREATE VIDEO</h1>
    </div>
  </div>
</header>
        <div id="connection" class="status">OFFLINE READY</div>

<section class="panel">
      <label for="generator">Generator</label>
      <select id="generator">
  <option value="google-veo">Google Veo</option>
  <option value="magic-hour">Magic Hour</option>
</select>

<label for="apiKey">Key</label>
<input
  id="apiKey"
  type="password"
  placeholder="Enter key..."
  autocomplete="off"
>

      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="Describe video..."></textarea>

      <div class="grid">
        <div>
          <label for="duration">Duration</label>
          <select id="duration">
            <option value="8">8 sec</option>
            <option value="6">6 sec</option>
            <option value="4">4 sec</option>
          </select>
        </div>
        <div>
          <label for="ratio">Aspect ratio</label>
          <select id="ratio">
            <option value="16:9">16:9</option>
            <option value="9:16">9:16</option>
            <option value="1:1">1:1</option>
          </select>
        </div>
      </div>

      <button id="generate">Generate</button>
      <p id="message" class="message"></p>
    </section>

    <section class="result">
      <h2>RESULT</h2>
      <div id="resultBox" class="result-box">
        <span>No video generated yet.</span>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
